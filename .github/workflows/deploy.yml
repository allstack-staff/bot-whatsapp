name: Deploy Infraestrutura do Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Duas execuções concorrentes aplicando Terraform sobre o mesmo state é a
# receita pra corromper infra ou disputar lock. Enfileira em vez de rodar em paralelo,
# e nunca cancela um apply/deploy já em andamento (deixaria a VM/infra pela metade).
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_gh_token: ${{ secrets.GH_PAT_TOKEN }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # --- A MARRETA DO SRE: Injetando a verdade absoluta no pipeline ---
      - name: Forçar Criação do Código Limpo
        run: |
          mkdir -p trigger-function
          
          cat << 'EOF' > trigger-function/package.json
          {
            "name": "trigger",
            "version": "1.0.0",
            "main": "index.js",
            "dependencies": {
              "@google-cloud/compute": "^4.0.0"
            }
          }
          EOF
          
          cat << 'EOF' > trigger-function/index.js
          const compute = require('@google-cloud/compute');
          const instancesClient = new compute.v1.InstancesClient();

          exports.triggerGithubAction = async (req, res) => {
            const project = process.env.GCP_PROJECT || 'all-stack-commnity';
            const zone = 'us-central1-c';
            const instance = 'baileys-bot-server';

            try {
              console.log(`Reiniciando a VM ${instance} para aplicar o novo deploy...`);
              
              // O comando reset reinicia a máquina.
              // Ao ligar, o GCP executa o seu metadata_startup_script automaticamente,
              // fazendo o git pull e subindo o PM2 com o código novo!
              await instancesClient.reset({
                project,
                zone,
                instance
              });

              res.status(200).send({ status: "VM reiniciada! O script de inicializacao fara o deploy." });
            } catch (err) {
              console.error("Erro ao reiniciar VM:", err);
              res.status(500).send({ error: err.message });
            }
          };
          EOF

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
        
      - name: Trigger VM Update
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          # 1. Captura a URL limpa do output do Terraform
          TRIGGER_URL=$(terraform output -raw trigger_url | tr -d '\r\n')
          if [ -z "$TRIGGER_URL" ]; then
            echo "::error::terraform output 'trigger_url' veio vazio — sem URL não há como acionar o redeploy da VM."
            exit 1
          fi
          echo "Chamando gatilho de deploy: $TRIGGER_URL"

          # 2. A Pausa Tática: Aguardando as regras de IAM propagarem nos servidores do GCP
          echo "Aguardando 45 segundos para propagação do IAM no GCP..."
          sleep 45

          # 3. Gera o Token de Identidade OIDC (O "crachá" do GitHub)
          ID_TOKEN=$(gcloud auth print-identity-token --audiences="$TRIGGER_URL")
          if [ -z "$ID_TOKEN" ]; then
            echo "::error::Não foi possível gerar o identity token do GCP."
            exit 1
          fi

          # 4. Envia o comando de atualização.
          # --fail-with-body: um 4xx/5xx da função (ela retorna 500 em erro) deve
          # derrubar o pipeline, não só falhas de rede/DNS.
          curl -v --fail-with-body -X POST "$TRIGGER_URL" \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H "Content-Type: application/json"
