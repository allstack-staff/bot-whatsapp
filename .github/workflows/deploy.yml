name: Deploy Infraestrutura do Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_gh_token: ${{ secrets.GH_PAT_TOKEN }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
        
      - name: Trigger VM Update
        if: github.ref == 'refs/heads/main'
        run: |
          # Captura a URL que o seu Terraform gera no output
          TRIGGER_URL=$(terraform output -raw trigger_url)
          echo "Chamando gatilho de deploy: $TRIGGER_URL"
          curl -X POST $TRIGGER_URL