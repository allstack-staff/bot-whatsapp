version: '3'

services:
  app:
    volumes:
      - /app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bot-v3
    restart: always
    environment:
      - OPENAI_API_KEY
      - PM2_PUBLIC_KEY
      - PM2_SECRET_KEY
      - NODE_ENV=production
      - BOT_TOKEN=your_token
      - BOT_NAME=your_bot_name
      - BOT_OWNER=your_owner_id
      - BOT_PREFIX=your_prefix
      - BOT_DB_URI=your_db_uri
      - BOT_DB_NAME=your_db_name
      - BOT_DB_COLLECTION=your_db_collection
      - BOT_DB_USER=your_db_user
      - BOT_DB_PASS=your_db_pass
